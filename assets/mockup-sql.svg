<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSQL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131c"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <filter id="glowSQL" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bgSQL)" rx="16"/>

  <g transform="translate(40, 30)" filter="url(#glowSQL)">
    <rect x="0" y="0" width="520" height="350" rx="14" fill="#0c0d14" stroke="#252738" stroke-width="2"/>
    
    <!-- Titlebar -->
    <path d="M0,14 C0,6.268 6.268,0 14,0 L506,0 C513.732,0 520,6.268 520,14 L520,40 L0,40 Z" fill="#161822"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    <text x="80" y="24" fill="#888c9f" font-family="monospace" font-size="11">DataStudio // gestao_database.sql</text>

    <!-- Sidebar & Main Split -->
    <rect x="0" y="40" width="130" height="310" fill="#12131b"/>
    <line x1="130" y1="40" x2="130" y2="350" stroke="#202230" stroke-width="1"/>

    <!-- Schema tree in sidebar -->
    <text x="16" y="66" fill="#6d7085" font-family="monospace" font-size="10" font-weight="bold">TABELAS (SCHEMA)</text>
    <text x="16" y="92" fill="#c3c6db" font-family="monospace" font-size="10">📁 utilizadores</text>
    <text x="16" y="114" fill="#c3c6db" font-family="monospace" font-size="10">📁 encomendas</text>
    <text x="16" y="136" fill="#00e599" font-family="monospace" font-size="10">📁 produtos</text>
    <text x="16" y="158" fill="#c3c6db" font-family="monospace" font-size="10">📁 stock_logs</text>
    <text x="16" y="180" fill="#c3c6db" font-family="monospace" font-size="10">📁 categorias</text>

    <!-- Query Editor Area -->
    <rect x="145" y="55" width="360" height="90" rx="8" fill="#141620" stroke="#262838" stroke-width="1"/>
    <text x="160" y="78" fill="#f59e0b" font-family="monospace" font-size="11">SELECT</text>
    <text x="212" y="78" fill="#c3c6db" font-family="monospace" font-size="11">p.id, p.nome, p.preco, s.quantidade</text>
    <text x="160" y="98" fill="#f59e0b" font-family="monospace" font-size="11">FROM</text>
    <text x="195" y="98" fill="#c3c6db" font-family="monospace" font-size="11">produtos p</text>
    <text x="160" y="118" fill="#3b82f6" font-family="monospace" font-size="11">INNER JOIN</text>
    <text x="240" y="118" fill="#c3c6db" font-family="monospace" font-size="11">stock s ON p.id = s.produto_id</text>
    <text x="160" y="136" fill="#f59e0b" font-family="monospace" font-size="11">ORDER BY</text>
    <text x="228" y="136" fill="#c3c6db" font-family="monospace" font-size="11">s.quantidade DESC;</text>

    <!-- Execution result bar -->
    <rect x="145" y="155" width="360" height="24" rx="4" fill="#181a26"/>
    <circle cx="158" cy="167" r="4" fill="#00e599"/>
    <text x="170" y="171" fill="#00e599" font-family="monospace" font-size="9">Query executada com sucesso em 14ms (124 linhas)</text>

    <!-- Result Data Table -->
    <rect x="145" y="188" width="360" height="145" rx="8" fill="#13141d" stroke="#252738" stroke-width="1"/>
    <rect x="145" y="188" width="360" height="26" fill="#1c1e2b"/>
    <text x="160" y="205" fill="#8d90a5" font-family="monospace" font-size="9">ID</text>
    <text x="195" y="205" fill="#8d90a5" font-family="monospace" font-size="9">NOME PRODUTO</text>
    <text x="340" y="205" fill="#8d90a5" font-family="monospace" font-size="9">PREÇO</text>
    <text x="430" y="205" fill="#8d90a5" font-family="monospace" font-size="9">QTD STOCK</text>

    <!-- Row 1 -->
    <text x="160" y="232" fill="#c3c6db" font-family="monospace" font-size="10">#001</text>
    <text x="195" y="232" fill="#ffffff" font-family="monospace" font-size="10">Monitor UltraWide 34"</text>
    <text x="340" y="232" fill="#00e599" font-family="monospace" font-size="10">€ 429.00</text>
    <text x="430" y="232" fill="#3b82f6" font-family="monospace" font-size="10">34 un.</text>

    <!-- Row 2 -->
    <line x1="145" y1="245" x2="505" y2="245" stroke="#1f2130" stroke-width="1"/>
    <text x="160" y="267" fill="#c3c6db" font-family="monospace" font-size="10">#002</text>
    <text x="195" y="267" fill="#ffffff" font-family="monospace" font-size="10">Hub USB-C 8-em-1</text>
    <text x="340" y="267" fill="#00e599" font-family="monospace" font-size="10">€ 49.90</text>
    <text x="430" y="267" fill="#3b82f6" font-family="monospace" font-size="10">89 un.</text>

    <!-- Row 3 -->
    <line x1="145" y1="280" x2="505" y2="280" stroke="#1f2130" stroke-width="1"/>
    <text x="160" y="302" fill="#c3c6db" font-family="monospace" font-size="10">#003</text>
    <text x="195" y="302" fill="#ffffff" font-family="monospace" font-size="10">Braço Articulado Monitor</text>
    <text x="340" y="302" fill="#00e599" font-family="monospace" font-size="10">€ 64.50</text>
    <text x="430" y="302" fill="#ef4444" font-family="monospace" font-size="10">3 un. (Baixo)</text>
  </g>
</svg>
