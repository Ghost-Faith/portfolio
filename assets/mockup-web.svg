<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accentW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowBrowser" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bgW)" rx="16"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(40, 30)" filter="url(#glowBrowser)">
    <!-- Browser Frame -->
    <rect x="0" y="0" width="520" height="350" rx="14" fill="#0d0e14" stroke="#252738" stroke-width="2"/>
    
    <!-- Window Titlebar -->
    <path d="M0,14 C0,6.268 6.268,0 14,0 L506,0 C513.732,0 520,6.268 520,14 L520,40 L0,40 Z" fill="#171822"/>
    
    <!-- Traffic light dots -->
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="90" y="10" width="310" height="20" rx="6" fill="#0d0e14"/>
    <circle cx="106" cy="20" r="3.5" fill="#00e599"/>
    <text x="120" y="24" fill="#888c9f" font-family="system-ui, sans-serif" font-size="10">https://shopflow.dev/products</text>

    <!-- Browser Content Area -->
    <rect x="0" y="40" width="520" height="310" fill="#0e0f16"/>

    <!-- Website Navbar -->
    <rect x="25" y="55" width="470" height="36" rx="8" fill="#181924"/>
    <text x="45" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">&lt;ShopFlow /&gt;</text>
    <rect x="360" y="62" width="60" height="22" rx="6" fill="#242636"/>
    <text x="390" y="77" fill="#c3c6d8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Carrinho (3)</text>
    <rect x="430" y="62" width="50" height="22" rx="6" fill="url(#accentW)"/>
    <text x="455" y="77" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Login</text>

    <!-- Hero Banner inside web app -->
    <rect x="25" y="105" width="470" height="90" rx="10" fill="#151722" stroke="#25273b" stroke-width="1"/>
    <text x="45" y="138" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Nova Coleção Tech 2026</text>
    <text x="45" y="158" fill="#888c9f" font-family="system-ui, sans-serif" font-size="11">Desenvolvido com JavaScript Puro & CSS Grid Dinâmico</text>
    <rect x="45" y="170" width="90" height="18" rx="4" fill="#00e599"/>
    <text x="90" y="183" fill="#05271c" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Ver Produtos →</text>

    <!-- 3 Product Cards Grid inside mockup -->
    <rect x="25" y="210" width="145" height="120" rx="8" fill="#161824" stroke="#27293a" stroke-width="1"/>
    <rect x="35" y="220" width="125" height="55" rx="6" fill="#202230"/>
    <text x="35" y="292" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Smart Watch V2</text>
    <text x="35" y="312" fill="#00e599" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">€ 149.99</text>

    <rect x="187" y="210" width="145" height="120" rx="8" fill="#161824" stroke="#27293a" stroke-width="1"/>
    <rect x="197" y="220" width="125" height="55" rx="6" fill="#202230"/>
    <text x="197" y="292" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Auscultadores Pro</text>
    <text x="197" y="312" fill="#00e599" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">€ 89.00</text>

    <rect x="350" y="210" width="145" height="120" rx="8" fill="#161824" stroke="#27293a" stroke-width="1"/>
    <rect x="360" y="220" width="125" height="55" rx="6" fill="#202230"/>
    <text x="360" y="292" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Teclado Mecânico</text>
    <text x="360" y="312" fill="#00e599" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">€ 119.50</text>
  </g>
</svg>
