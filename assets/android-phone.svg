<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <linearGradient id="screenGloss" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#ffffff" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- External Body with Titanium Rim -->
  <g filter="url(#phoneShadow)">
    <rect x="10" y="10" width="320" height="660" rx="48" fill="url(#phoneFrame)" stroke="#52525b" stroke-width="1.5"/>
    
    <!-- Screen Bezel -->
    <rect x="20" y="20" width="300" height="640" rx="40" fill="url(#screenGlass)"/>

    <!-- Dynamic Island / Top Camera Punch -->
    <rect x="120" y="32" width="100" height="24" rx="12" fill="#000000"/>
    <circle cx="195" cy="44" r="5" fill="#18181b"/>
    <circle cx="195" cy="44" r="2" fill="#27272a"/>

    <!-- Screen Gloss Overlay -->
    <rect x="20" y="20" width="300" height="640" rx="40" fill="url(#screenGloss)" pointer-events="none"/>

    <!-- Bottom Indicator Pill -->
    <rect x="125" y="642" width="90" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
